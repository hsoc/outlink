name: Build Mobile Apps
on:
  workflow_dispatch:
    inputs:
      android:
        description: Build signed Android APK + AAB (testing APK if no signing key)
        type: boolean
        default: true
      ios:
        description: Build signed iOS IPA (requires iOS certificate and profile)
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:mobile
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run licenses:check
      - run: npm run export:mobile
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_APP_ENV: production
  android:
    needs: checks
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - run: npm ci
      - name: Check Android signing availability
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "HAS_ANDROID_SIGNING=$([[ -n \"$ANDROID_KEYSTORE_BASE64\" ]] && echo true || echo false)" >> "$GITHUB_ENV"
      - run: npm run android:apk
        env:
          CI: '1'
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: release/Outlink-android.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed Google Play bundle
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: release/Outlink-android.aab
          if-no-files-found: error
          retention-days: 14
  ios:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
      - run: bash scripts/mobile-ios-build.sh
        env:
          CI: '1'
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: release/ios/*.ipa
          if-no-files-found: error
          retention-days: 14
  release:
    needs: android
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Publish verified Android release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app.json').expo.version")
          case "$RELEASE_TAG" in
            "v$VERSION"|"v$VERSION-beta."[0-9]*) ;;
            *) echo 'Release tag does not match app version'; exit 1 ;;
          esac
          NOTES="docs/releases/$VERSION.md"
          test -s "$NOTES"
          mkdir -p release/apk release/aab
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-apk --dir release/apk
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-aab --dir release/aab
          test -s release/apk/Outlink-android.apk
          test -s release/aab/Outlink-android.aab
          cp "$NOTES" release/RELEASE_NOTES.md
          printf '\nSource commit: `%s`. [Verified build](%s/%s/actions/runs/%s).\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release/RELEASE_NOTES.md
          cp release/apk/Outlink-android.apk release/Outlink-android.apk
          cp release/aab/Outlink-android.aab release/Outlink-android.aab
          (cd release && sha256sum Outlink-android.apk Outlink-android.aab > SHA256SUMS.txt)
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            release/Outlink-android.apk release/Outlink-android.aab release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title "Outlink $RELEASE_TAG" --notes-file release/RELEASE_NOTES.md "${flags[@]}"
