name: Build Mobile Apps
on:
  workflow_dispatch:
    inputs:
      android:
        description: Build signed Android APK + AAB (testing APK if no signing key)
        type: boolean
        default: true
      ios:
        description: Build signed iOS IPA (requires iOS certificate and profile)
        type: boolean
        default: false
  push:
    branches: [master]
    paths: ['app.json']
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test scripts/android-gradle.test.mjs
      - run: python3 scripts/android-r8-report.test.py
      - run: npm run check:mobile
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run licenses:check
      - run: npm run export:mobile
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_APP_ENV: production
  android:
    needs: checks
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - run: npm ci
      - name: Check Android signing availability
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "HAS_ANDROID_SIGNING=$([[ -n \"$ANDROID_KEYSTORE_BASE64\" ]] && echo true || echo false)" >> "$GITHUB_ENV"
      - run: npm run android:apk
        env:
          CI: '1'
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Preserve native build diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-diagnostics
          path: |
            release/android-diagnostics/
            node_modules/react-native-screens/android/.cxx/**/CMakeCache.txt
            node_modules/react-native-screens/android/.cxx/**/CMakeFiles/CMakeOutput.log
            node_modules/react-native-screens/android/.cxx/**/CMakeFiles/CMakeError.log
            node_modules/react-native-screens/android/.cxx/**/logs/**
            node_modules/react-native-worklets/android/.cxx/**/logs/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve R8 mappings and optimization reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-r8-reports
          path: |
            android/app/build/outputs/mapping/release/
            release/android-r8-report.json
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: release/Outlink-android.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed Google Play bundle
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: release/Outlink-android.aab
          if-no-files-found: error
          retention-days: 14
  android-smoke:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check the optimized release app starts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/android-release-smoke.sh release/Outlink-android.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-release-smoke
          path: release/android-smoke/
          if-no-files-found: ignore
          retention-days: 14
  ios:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
      - run: bash scripts/mobile-ios-build.sh
        env:
          CI: '1'
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: release/ios/*.ipa
          if-no-files-found: error
          retention-days: 14
  release:
    needs: [android, android-smoke]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Publish verified Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app.json').expo.version")
          if [[ "$GITHUB_REF" == 'refs/heads/master' ]]; then
            RELEASE_TAG="v$VERSION"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          case "$RELEASE_TAG" in
            "v$VERSION"|"v$VERSION-beta."[0-9]*) ;;
            *) echo 'Release tag does not match app version'; exit 1 ;;
          esac
          # Asset/config updates can keep the published app version unchanged.
          # Build their artifacts without attempting to republish that version.
          if [[ "$GITHUB_REF" == 'refs/heads/master' ]] && gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already published; keeping existing assets: $RELEASE_TAG"
            exit 0
          fi
          NOTES="docs/releases/$VERSION.md"
          test -s "$NOTES"
          mkdir -p release/apk release/aab
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-apk --dir release/apk
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-aab --dir release/aab
          test -s release/apk/Outlink-android.apk
          test -s release/aab/Outlink-android.aab
          cp "$NOTES" release/RELEASE_NOTES.md
          printf '\nSource commit: `%s`. [Verified build](%s/%s/actions/runs/%s).\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release/RELEASE_NOTES.md
          cp release/apk/Outlink-android.apk release/Outlink-android.apk
          cp release/aab/Outlink-android.aab release/Outlink-android.aab
          (cd release && sha256sum Outlink-android.apk Outlink-android.aab > SHA256SUMS.txt)
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          # Create the version tag after checks and signed artifacts exist.
          # GITHUB_TOKEN-authored tag pushes do not schedule another workflow.
          if [[ "$GITHUB_REF" == 'refs/heads/master' ]]; then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release already exists: $RELEASE_TAG"; exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Tag already exists: $RELEASE_TAG"; exit 1
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" \
            release/Outlink-android.apk release/Outlink-android.aab release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title "Outlink $RELEASE_TAG" --notes-file release/RELEASE_NOTES.md "${flags[@]}"
