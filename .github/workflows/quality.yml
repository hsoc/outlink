name: Mobile quality checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:mobile
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run licenses:check
      - run: npm run export:mobile
